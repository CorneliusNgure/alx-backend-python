<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Unread Messages</h2>
<ul>
  {% for msg in messages %}
    <li><strong>{{ msg.sender }}:</strong> {{ msg.content }}</li>
  {% empty %}
    <li>No unread messages.</li>
  {% endfor %}
</ul>

</body>
</html>
